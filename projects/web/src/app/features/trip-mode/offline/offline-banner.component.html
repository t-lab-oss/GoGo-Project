<!-- Vùng live luôn có trong DOM để trình đọc màn hình đọc được khi trạng thái đổi. -->
<div aria-live="polite">
  @if (visible()) {
    <section class="rounded-[18px] bg-ink px-3.5 py-2 text-white">
      <div class="flex items-center gap-3">
        <button
          type="button"
          class="flex min-h-11 min-w-0 flex-1 cursor-pointer items-center gap-2.5 border-0 bg-transparent p-0 text-left text-white disabled:cursor-default"
          [disabled]="items().length === 0"
          [attr.aria-expanded]="items().length ? expanded() : null"
          (click)="expanded.set(!expanded())"
        >
          <span class="h-2.5 w-2.5 flex-none rounded-full" [class]="outbox.online() ? 'bg-brand-soft' : 'bg-accent'" aria-hidden="true"></span>
          <span class="min-w-0">
            <span class="block text-sm font-semibold">{{ title() }}</span>
            <span class="block text-xs text-white/75">{{ subtitle() }}</span>
          </span>
          @if (items().length) {
            <span class="ml-auto flex-none text-white/75" aria-hidden="true">{{ expanded() ? '▴' : '▾' }}</span>
          }
        </button>
        @if (items().length) {
          <button type="button" class="min-h-11 flex-none cursor-pointer rounded-xl border-0 bg-white/15 px-3 text-[13px] font-semibold text-white" [disabled]="outbox.syncing()" (click)="outbox.flush()">
            Gửi ngay
          </button>
        }
      </div>
      @if (expanded() && items().length) {
        <ul class="m-0 mt-1 flex max-h-44 list-none flex-col gap-1.5 overflow-y-auto border-t border-white/15 p-0 pt-2">
          @for (i of items(); track i.seq) {
            <li class="rounded-xl bg-white/10 px-3 py-2 text-[13px]">
              <div class="flex items-center justify-between gap-3">
                <span class="min-w-0 truncate">{{ describe(i) }}</span>
                <span class="flex-none text-xs font-semibold" [class]="i.error ? 'text-accent' : 'text-white/75'">{{ i.error ? 'Lỗi' : 'Chờ' }}</span>
              </div>
              @if (i.error) {
                <p class="m-0 mt-1 text-xs text-white/75">{{ i.error }}</p>
                <div class="flex justify-end gap-2">
                  <button type="button" class="min-h-11 cursor-pointer border-0 bg-transparent px-3 text-xs font-semibold text-white/75" (click)="outbox.discard(i.seq)">Bỏ mục này</button>
                  <button type="button" class="min-h-11 cursor-pointer border-0 bg-transparent px-3 text-xs font-semibold text-white" (click)="outbox.retry(i.seq)">Thử lại</button>
                </div>
              }
            </li>
          }
        </ul>
      }
    </section>
  }
</div>
