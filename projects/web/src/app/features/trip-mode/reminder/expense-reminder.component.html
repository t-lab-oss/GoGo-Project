<!-- Sân khấu tràn ra mép màn hình để thẻ trượt đi tự nhiên và bóng đổ không bị cắt. -->
<div class="relative -mx-5 -my-3 overflow-x-clip px-5 py-3">
  <!-- Hai quầng màu phía sau, nhìn xuyên qua mặt kính. -->
  <span class="blob blob-pink" aria-hidden="true"></span>
  <span class="blob blob-blue" aria-hidden="true"></span>

  <div
    class="relative"
    data-track
    [class.nudge]="!touched() && !leaving()"
    [class.settle]="!dragging()"
    [style.transform]="transform()"
    (focusin)="touched.set(true)"
  >
    <!-- Dải nằm ngoài mép trái thẻ, đi theo thẻ nên chỉ lộ ra khi thẻ trượt sang phải. -->
    <div
      class="behind absolute inset-y-0 right-[calc(100%+20px)] flex w-full items-center justify-end gap-1.5 rounded-lg pr-3 text-[13px] font-semibold text-white"
      [class.armed]="armed()"
      data-behind
      aria-hidden="true"
    >
      <span>{{ armed() ? 'Thả để bỏ qua' : 'Bỏ qua' }}</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </div>

    <section class="glass relative select-none overflow-hidden rounded-lg p-3" aria-labelledby="rm-title">
      <div class="flex items-center gap-2.5">
        <span class="coin flex h-8 w-8 flex-none items-center justify-center rounded-full text-[15px] font-extrabold text-white" aria-hidden="true">₫</span>
        <h2 id="rm-title" class="m-0 min-w-0 flex-1 leading-tight">
          <span class="block truncate text-[15px] font-bold">{{ checkin().placeLabel }}</span>
          <span class="block text-[13px] font-medium text-muted">hết bao nhiêu?</span>
        </h2>
        <button
          type="button"
          class="-my-2.5 -mr-2 min-h-11 flex-none cursor-pointer rounded-md border-0 bg-transparent px-2 text-[13px] font-semibold text-muted"
          [disabled]="saving()"
          (click)="skip()"
        >
          Bỏ qua
        </button>
      </div>

      <form class="mt-2.5 flex gap-2" (submit)="save($event)" novalidate>
        <div class="relative min-w-0 flex-1">
          <input
            class="field-input h-11 !bg-white/70 min-w-0 select-text rounded-md pr-9 text-lg font-bold tabular-nums placeholder:text-[15px] placeholder:font-normal"
            [class.invalid]="error()"
            type="text"
            inputmode="numeric"
            enterkeyhint="done"
            autocomplete="off"
            placeholder="Số tiền"
            [attr.aria-label]="'Số tiền đã chi ở ' + checkin().placeLabel"
            [attr.aria-describedby]="error() ? 'rm-error' : 'rm-hint'"
            [attr.aria-invalid]="error() ? 'true' : null"
            [value]="amountText()"
            [readOnly]="saving()"
            (input)="onInput($event)"
          />
          <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-[15px] text-muted" aria-hidden="true">đ</span>
        </div>
        <button type="submit" class="btn btn-primary h-11 w-auto flex-none rounded-md px-5" [disabled]="saving()">
          {{ saving() ? 'Đang lưu…' : 'Lưu' }}
        </button>
      </form>

      @if (error()) {
        <p id="rm-error" class="m-0 mt-2 text-[13px] text-danger" role="alert">{{ error() }}</p>
      } @else {
        <p id="rm-hint" class="m-0 mt-2 flex items-center justify-between gap-3 text-xs text-muted">
          <span class="flex items-center gap-1.5">
            Lướt sang phải để bỏ qua
            <!-- Ba mũi tên sáng dần từ trái sang phải. -->
            <span class="flex" aria-hidden="true">
              @for (i of [0, 1, 2]; track i) {
                <svg class="chevron -mr-1 text-brand" [style.animation-delay.ms]="i * 160" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 5l7 7-7 7" />
                </svg>
              }
            </span>
          </span>
          <span class="flex-none">Nhắc lần {{ checkin().expenseReminder.skipCount + 1 }}/2</span>
        </p>
      }
    </section>
  </div>
</div>
