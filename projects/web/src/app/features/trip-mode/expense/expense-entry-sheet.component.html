<div class="fixed inset-0 z-50 flex items-end justify-center">
  <div class="backdrop absolute inset-0 bg-ink/45" aria-hidden="true" (click)="close()"></div>
  <div
    #panel
    class="panel relative flex max-h-[96dvh] w-full max-w-[430px] flex-col overflow-y-auto rounded-t-3xl bg-surface px-5 pb-5 shadow-[0_-12px_40px_rgba(11,47,74,0.25)]"
    role="dialog"
    aria-modal="true"
    aria-labelledby="exp-title"
    (keydown)="onKeydown($event)"
  >
    <!-- Lướt phần đầu xuống để đóng. -->
    <div class="touch-none select-none" appSwipe (appSwipe)="$event === 'down' && close()">
      <div class="flex justify-center pt-2.5" aria-hidden="true"><span class="h-1.5 w-11 rounded-full bg-line"></span></div>
      <header class="flex items-center justify-between gap-3 pt-1.5">
        <span class="w-11 flex-none" aria-hidden="true"></span>
        <div class="min-w-0 text-center">
          <h2 id="exp-title" class="m-0 truncate text-[19px] font-bold tracking-[-0.3px]">{{ target().placeLabel }}</h2>
          <p class="m-0 text-[13px] text-muted">{{ target().subtitle }}</p>
        </div>
        <button type="button" data-autofocus class="icon-btn cursor-pointer border-0" aria-label="Đóng" (click)="close()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </header>
    </div>

    <!-- Lướt sang trái trên số tiền để xoá một chữ số. -->
    <div class="touch-none select-none py-5 text-center" appSwipe (appSwipe)="$event === 'left' && press('⌫')">
      <p class="m-0" aria-live="polite">
        <span class="text-[52px] font-extrabold leading-none tracking-[-2px]" [class.text-muted]="!digits()">{{ amountText() }}</span>
        <span class="text-2xl text-muted"> đ</span>
      </p>
      <p class="m-0 mt-1 text-xs text-muted">Lướt trái trên số để xoá</p>
    </div>

    <input
      class="field-input"
      type="text"
      aria-label="Ghi chú"
      placeholder="Ghi chú (nếu cần)"
      maxlength="200"
      autocomplete="off"
      enterkeyhint="done"
      [value]="note()"
      (input)="onNote($event)"
    />

    <div class="mt-3 grid grid-cols-3 gap-2" role="group" aria-label="Bàn phím số">
      @for (key of keys; track key) {
        <button
          type="button"
          class="h-[54px] cursor-pointer touch-manipulation select-none rounded-2xl border-0 bg-white text-[22px] font-semibold text-ink transition-transform active:scale-95 active:bg-brand-soft motion-reduce:transition-none"
          [attr.aria-label]="key === '⌫' ? 'Xoá số cuối' : key"
          (click)="press(key)"
        >
          {{ key }}
        </button>
      }
    </div>

    @if (error()) {
      <p class="m-0 mt-3 rounded-xl bg-accent-soft px-3.5 py-2.5 text-center text-sm text-danger" role="alert">{{ error() }}</p>
    }
    <button type="button" class="btn btn-primary mt-3 min-h-[54px] cursor-pointer" [disabled]="saving()" (click)="save()">
      {{ saving() ? 'Đang lưu…' : 'Lưu' }}
    </button>
  </div>
</div>
