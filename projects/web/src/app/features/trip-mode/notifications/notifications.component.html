<!-- Cả lớp phủ là hộp thoại, để thao tác lướt của màn phía sau không nhận nhầm. -->
<div class="fixed inset-0 z-50 flex justify-center" role="dialog" aria-modal="true" aria-labelledby="nt-title" (keydown)="onKeydown($event)">
  <div class="relative h-full w-full max-w-[430px]">
    <!-- Chạm ra ngoài để đóng. -->
    <div class="absolute inset-0 bg-ink/10" data-backdrop aria-hidden="true" (click)="closed.emit()"></div>

    <div
      #panel
      tabindex="-1"
      class="panel absolute right-3 top-[72px] flex max-h-[min(70dvh,520px)] w-[calc(100%-24px)] max-w-[360px] flex-col overflow-hidden rounded-[20px] border border-line bg-white shadow-[0_16px_40px_rgba(11,47,74,0.18)] outline-none"
    >
      <header class="flex min-h-[52px] items-center justify-between gap-3 border-b border-line pl-4 pr-2">
        <h2 id="nt-title" class="m-0 text-base font-bold tracking-[-0.2px]">Thông báo</h2>
        @if (unread() > 0) {
          <button type="button" class="min-h-11 cursor-pointer rounded-xl border-0 bg-transparent px-2 text-[13px] font-semibold text-brand hover:bg-brand-soft" (click)="markAll()">
            Đọc tất cả
          </button>
        }
      </header>

      @if (error()) {
        <div class="flex items-center justify-between gap-3 bg-accent-soft py-1 pl-4 pr-2" role="alert">
          <p class="m-0 text-[13px] text-danger">{{ error() }}</p>
          <button type="button" class="min-h-11 flex-none cursor-pointer border-0 bg-transparent px-2 text-[13px] font-semibold text-brand" (click)="load()">Thử lại</button>
        </div>
      }

      @if (items().length > 0) {
        <ul class="m-0 flex-1 list-none divide-y divide-line overflow-y-auto overscroll-contain p-0">
          @for (n of items(); track n.id) {
            @if (text(n); as t) {
              <li>
                <button
                  type="button"
                  class="flex w-full cursor-pointer items-start gap-3 border-0 px-4 py-3 text-left"
                  [class]="n.readAt ? 'bg-white hover:bg-surface' : 'bg-brand-soft/50 hover:bg-brand-soft'"
                  (click)="open(n)"
                >
                  <span class="flex h-9 w-9 flex-none items-center justify-center rounded-full" [class]="n.readAt ? 'bg-surface text-muted' : 'bg-white text-brand'" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      @switch (n.type) {
                        @case ('expense_skipped') {
                          <path d="M19 7H5a2 2 0 0 1 0-4h12v4" /><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1" /><path d="M16 14h.01" />
                        }
                        @case ('rain') {
                          <path d="M17 15a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 6 15" /><path d="M8 18l-1 2M13 18l-1 2M18 18l-1 2" />
                        }
                        @default {
                          <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
                        }
                      }
                    </svg>
                  </span>
                  <span class="min-w-0 flex-1">
                    @if (!n.readAt) {
                      <span class="sr-only">Chưa đọc: </span>
                    }
                    <span class="block text-sm leading-snug" [class]="n.readAt ? 'font-medium text-muted' : 'font-semibold text-ink'">{{ t.title }}</span>
                    <span class="mt-0.5 block text-[13px] leading-snug text-muted">{{ t.body }}</span>
                    <span class="mt-1 block text-xs" [class]="n.readAt ? 'text-muted' : 'font-semibold text-brand'">{{ when(n) }}</span>
                  </span>
                  <!-- Giữ chỗ cho chấm đỏ để chữ không nhảy khi đã đọc. -->
                  <span class="mt-1.5 h-2.5 w-2.5 flex-none rounded-full" [class.bg-alert]="!n.readAt" [attr.data-unread]="n.readAt ? null : ''" aria-hidden="true"></span>
                </button>
              </li>
            }
          }
        </ul>
      } @else if (loaded()) {
        <p class="m-0 px-4 py-8 text-center text-sm text-muted">Chưa có thông báo nào.</p>
      } @else if (!error()) {
        <p class="m-0 px-4 py-8 text-center text-sm text-muted" role="status">Đang tải…</p>
      }

      <!-- Nút đóng cho bàn phím và trình đọc màn hình, chỉ hiện khi được chọn. -->
      <button type="button" class="sr-only focus:not-sr-only focus:!min-h-11 focus:cursor-pointer focus:border-0 focus:bg-surface focus:text-[13px] focus:font-semibold focus:text-brand" (click)="closed.emit()">
        Đóng thông báo
      </button>
    </div>
  </div>
</div>
