<main class="flex min-h-dvh flex-col gap-3.5 px-5 pb-6 pt-5">
  <div class="h-[70px]"></div>

  <div class="text-center">
    <h1 class="m-0 text-[44px] font-extrabold tracking-[-0.5px] text-brand">
      Go!<span class="text-accent">Go!</span>
    </h1>
    <p class="mt-1.5 text-sm text-muted">Mỗi chuyến đi, gọn trong một chỗ</p>
  </div>

  <div class="h-[30px]"></div>

  <form class="flex flex-col gap-3.5" (ngSubmit)="submit()" novalidate>
    <h2 class="m-0 text-[30px] font-extrabold leading-[1.1] tracking-[-1px]">Đăng nhập</h2>

    <div>
      <label class="field-label" for="username">Tên đăng nhập</label>
      <input
        class="field-input"
        [class.invalid]="usernameError()"
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        placeholder="vd: hany"
        [ngModel]="username()"
        (ngModelChange)="username.set($event); usernameError.set('')"
        [attr.aria-invalid]="usernameError() ? 'true' : null"
        [attr.aria-describedby]="usernameError() ? 'username-error' : null"
      />
      @if (usernameError()) {
        <p id="username-error" class="mt-1.5 text-[13px] text-danger">{{ usernameError() }}</p>
      }
    </div>

    <div>
      <label class="field-label" for="password">Mật khẩu</label>
      <input
        class="field-input"
        [class.invalid]="passwordError()"
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Nhập mật khẩu"
        [ngModel]="password()"
        (ngModelChange)="password.set($event); passwordError.set('')"
        [attr.aria-invalid]="passwordError() ? 'true' : null"
        [attr.aria-describedby]="passwordError() ? 'password-error' : null"
      />
      @if (passwordError()) {
        <p id="password-error" class="mt-1.5 text-[13px] text-danger">{{ passwordError() }}</p>
      }
    </div>

    @if (formError()) {
      <p class="m-0 rounded-[14px] bg-accent-soft px-3.5 py-3 text-[13px] text-danger" role="alert">
        {{ formError() }}
      </p>
    }

    <button class="btn btn-primary mt-1.5" type="submit" [disabled]="loading()">
      {{ loading() ? 'Đang đăng nhập…' : 'Đăng nhập' }}
    </button>
  </form>
</main>
