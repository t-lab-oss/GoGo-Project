<main class="flex min-h-dvh flex-col gap-4 px-5 pb-6 pt-5">
  <header class="flex items-center justify-between">
    <span class="text-[26px] font-extrabold tracking-[-0.5px] text-brand">
      Go!<span class="text-accent">Go!</span>
    </span>
    <a
      routerLink="/account"
      class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-soft text-[15px] font-bold text-brand"
      [attr.aria-label]="'Tài khoản của ' + username()"
    >
      {{ initial() }}
    </a>
  </header>

  <h1 class="m-0 text-[30px] font-extrabold leading-[1.1] tracking-[-1px]">Chuyến đi của bạn</h1>
  <p class="card m-0 p-4 text-sm text-muted">
    Chào {{ username() }}. Danh sách chuyến đi sẽ có ở bước tiếp theo.
  </p>
</main>
